name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手動実行も可能

jobs:
  # ──────────────────────────────────────────────
  # WordPress テーマ SFTP デプロイ
  # ──────────────────────────────────────────────
  deploy-theme:
    name: Deploy WordPress Theme
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -v -H hachi-wellnesshack.com >> ~/.ssh/known_hosts 2>&1 || true
          cat ~/.ssh/known_hosts | wc -l

      - name: Test SSH connection
        run: |
          ssh -v \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ secrets.SFTP_USER }}@hachi-wellnesshack.com" \
            "echo SSH_OK && pwd" 2>&1 || true

      - name: Deploy theme via rsync
        run: |
          rsync -avzr --delete \
            --exclude='wp-config.php' \
            --exclude='wp-config-security.php' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15" \
            hachi-wp-secure/ \
            "${{ secrets.SFTP_USER }}@hachi-wellnesshack.com:${{ secrets.SFTP_REMOTE_PATH }}"

      - name: Notify Slack — Deploy success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚀 *HACHI-web* theme deployed successfully",
              "attachments": [{
                "color": "#36a64f",
                "fields": [
                  {"title": "Commit", "value": "`${{ github.sha }}`", "short": true},
                  {"title": "Branch", "value": "`${{ github.ref_name }}`", "short": true}
                ]
              }]
            }'

      - name: Notify Slack — Deploy failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"❌ *HACHI-web* deploy FAILED — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"}'
