<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 280"
  role="img"
  aria-labelledby="sf-title"
  style="display:block;width:100%;max-width:960px;"
>
  <title id="sf-title">コンディション・インサイト — サービスの流れ：社員チェック → 傾向の整理 → 組織全体として把握 → 現場コンディショニング指導</title>

  <!-- Background: white -->
  <rect width="960" height="280" fill="#ffffff"/>

  <!-- ===== STEP 01 ===== -->
  <!-- Node box -->
  <rect x="60" y="80" width="160" height="120" rx="2" ry="2"
        fill="#f5f5f5" fill-opacity="0.6"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.7"/>
  <!-- Step number -->
  <text x="76" y="108"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.08em"
        fill="#6e6e73" fill-opacity="0.9">
    01
  </text>
  <!-- Label -->
  <text x="76" y="136"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="13" letter-spacing="0.05em" font-weight="500"
        fill="#1d1d1f">
    社員の
  </text>
  <text x="76" y="154"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="13" letter-spacing="0.05em" font-weight="500"
        fill="#1d1d1f">
    短いチェック
  </text>
  <!-- Sub label -->
  <text x="76" y="176"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.04em"
        fill="#6e6e73">
    10分以内
  </text>

  <!-- ===== ARROW 01→02 ===== -->
  <line x1="220" y1="140" x2="276" y2="140"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.5"
        stroke-linecap="round"/>
  <path d="M 272 135 L 280 140 L 272 145"
        fill="none" stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== STEP 02 ===== -->
  <rect x="280" y="80" width="160" height="120" rx="2" ry="2"
        fill="#f5f5f5" fill-opacity="0.6"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.7"/>
  <text x="296" y="108"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.08em"
        fill="#6e6e73" fill-opacity="0.9">
    02
  </text>
  <text x="296" y="136"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="13" letter-spacing="0.05em" font-weight="500"
        fill="#1d1d1f">
    身体・睡眠・
  </text>
  <text x="296" y="154"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="13" letter-spacing="0.05em" font-weight="500"
        fill="#1d1d1f">
    集中・疲労
  </text>
  <text x="296" y="176"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.04em"
        fill="#6e6e73">
    傾向を整理
  </text>

  <!-- ===== ARROW 02→03 (accent) ===== -->
  <line x1="440" y1="140" x2="496" y2="140"
        stroke="#1d1d1f" stroke-width="1.2" stroke-opacity="0.6"
        stroke-linecap="round"/>
  <!-- Accent circle at midpoint of this arrow — the conversion moment -->
  <circle cx="468" cy="140" r="4.5"
          fill="#2D4295" fill-opacity="0.92"/>
  <path d="M 492 135 L 500 140 L 492 145"
        fill="none" stroke="#1d1d1f" stroke-width="1.2" stroke-opacity="0.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== STEP 03 (focal) ===== -->
  <rect x="500" y="72" width="180" height="136" rx="2" ry="2"
        fill="#e8e8ed" fill-opacity="0.55"
        stroke="#1d1d1f" stroke-width="1.5" stroke-opacity="0.85"/>
  <text x="518" y="102"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.08em"
        fill="#6e6e73" fill-opacity="0.9">
    03
  </text>
  <text x="518" y="132"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="13" letter-spacing="0.05em" font-weight="600"
        fill="#1d1d1f">
    組織全体の
  </text>
  <text x="518" y="150"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="13" letter-spacing="0.05em" font-weight="600"
        fill="#1d1d1f">
    状態傾向として
  </text>
  <text x="518" y="170"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.04em"
        fill="#6e6e73">
    経営者・管理職が把握
  </text>
  <!-- Subtle underline to reinforce focus -->
  <line x1="518" y1="180" x2="658" y2="180"
        stroke="#1d1d1f" stroke-width="0.5" stroke-opacity="0.25"
        stroke-linecap="round"/>
  <text x="518" y="195"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="10" letter-spacing="0.04em"
        fill="#6e6e73" fill-opacity="0.75">
    把握しやすい形でまとめ
  </text>

  <!-- ===== ARROW 03→04 ===== -->
  <line x1="680" y1="140" x2="716" y2="140"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.5"
        stroke-linecap="round"/>
  <path d="M 712 135 L 720 140 L 712 145"
        fill="none" stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== STEP 04 ===== -->
  <rect x="720" y="80" width="180" height="120" rx="2" ry="2"
        fill="#f5f5f5" fill-opacity="0.6"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.55"
        stroke-dasharray="4 3"/>
  <text x="736" y="108"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.08em"
        fill="#6e6e73" fill-opacity="0.9">
    04
  </text>
  <text x="736" y="136"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="12" letter-spacing="0.04em" font-weight="500"
        fill="#1d1d1f">
    現場コンディショニング
  </text>
  <text x="736" y="154"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="12" letter-spacing="0.04em" font-weight="500"
        fill="#1d1d1f">
    指導
  </text>
  <text x="736" y="176"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.04em"
        fill="#6e6e73">
    希望企業のみ
  </text>

  <!-- ===== Optional: hairline baseline ===== -->
  <line x1="60" y1="240" x2="900" y2="240"
        stroke="#1d1d1f" stroke-width="0.5" stroke-opacity="0.08"
        stroke-linecap="round"/>

</svg>
