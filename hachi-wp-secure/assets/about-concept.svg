<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 400"
  role="img"
  aria-labelledby="ac-title"
  style="display:block;width:100%;max-width:800px;"
>
  <title id="ac-title">HACHIの思想の構造図 — 観察・構造化・判断知への変換：身体知を、再現可能な判断知へ</title>

  <!-- Background: white -->
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- ===================================================
       AXIS: single horizontal line spanning 3 nodes
       Node positions:  x=172, x=400, x=628
       y-axis center:   y=200
  =================================================== -->

  <!-- Axis baseline (full span, hairline) -->
  <line x1="100" y1="200" x2="700" y2="200"
        stroke="#1d1d1f" stroke-width="0.8" stroke-opacity="0.18"
        stroke-linecap="round"/>

  <!-- ===================================================
       NODE 1 — 観察
       Position: x=172, y=200
  =================================================== -->

  <!-- Outer ring (structure, low opacity) -->
  <circle cx="172" cy="200" r="28"
          fill="none"
          stroke="#1d1d1f" stroke-width="0.9" stroke-opacity="0.22"/>

  <!-- Inner node dot -->
  <circle cx="172" cy="200" r="5"
          fill="#1d1d1f" fill-opacity="0.75"/>

  <!-- Node label — upper -->
  <text x="172" y="154"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="14" letter-spacing="0.08em" font-weight="500"
        fill="#1d1d1f" text-anchor="middle">
    観察
  </text>

  <!-- Sub label — lower -->
  <text x="172" y="262"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.06em"
        fill="#6e6e73" fill-opacity="0.85" text-anchor="middle">
    Observe
  </text>

  <!-- Connector: node 1 → node 2 -->
  <!-- Left segment -->
  <line x1="200" y1="200" x2="370" y2="200"
        stroke="#1d1d1f" stroke-width="0.9" stroke-opacity="0.30"
        stroke-linecap="round"/>
  <!-- Arrowhead pointing right at node 2 approach -->
  <path d="M 366 196 L 374 200 L 366 204"
        fill="none"
        stroke="#1d1d1f" stroke-width="0.9" stroke-opacity="0.30"
        stroke-linecap="round" stroke-linejoin="round"/>


  <!-- ===================================================
       NODE 2 — 構造化
       Position: x=400, y=200
  =================================================== -->

  <!-- Outer ring -->
  <circle cx="400" cy="200" r="28"
          fill="#f5f5f5" fill-opacity="0.70"
          stroke="#1d1d1f" stroke-width="0.9" stroke-opacity="0.28"/>

  <!-- Inner node dot -->
  <circle cx="400" cy="200" r="5"
          fill="#1d1d1f" fill-opacity="0.75"/>

  <!-- Node label — upper -->
  <text x="400" y="154"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="14" letter-spacing="0.08em" font-weight="500"
        fill="#1d1d1f" text-anchor="middle">
    構造化
  </text>

  <!-- Sub label — lower -->
  <text x="400" y="262"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.06em"
        fill="#6e6e73" fill-opacity="0.85" text-anchor="middle">
    Structure
  </text>

  <!-- Connector: node 2 → node 3 -->
  <line x1="428" y1="200" x2="598" y2="200"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.36"
        stroke-linecap="round"/>
  <path d="M 594 196 L 602 200 L 594 204"
        fill="none"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.36"
        stroke-linecap="round" stroke-linejoin="round"/>


  <!-- ===================================================
       NODE 3 — 判断
       Position: x=628, y=200
       #2D4295 accent — the single focal point of knowledge conversion
  =================================================== -->

  <!-- Outer ring — slightly heavier to mark focus -->
  <circle cx="628" cy="200" r="32"
          fill="#e8e8ed" fill-opacity="0.45"
          stroke="#1d1d1f" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- #2D4295 accent dot — the 1 per figure rule, placed at the conversion point -->
  <circle cx="628" cy="200" r="6"
          fill="#2D4295" fill-opacity="0.90"/>

  <!-- Node label — upper -->
  <text x="628" y="150"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="14" letter-spacing="0.08em" font-weight="600"
        fill="#1d1d1f" text-anchor="middle">
    判断
  </text>

  <!-- Sub label — lower (from page copy: 再現可能な判断知) -->
  <text x="628" y="262"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.06em"
        fill="#6e6e73" fill-opacity="0.85" text-anchor="middle">
    Reproducible Knowledge
  </text>


  <!-- ===================================================
       THESIS LABEL — bottom center
       Drawn from page-about.php copy: 身体知を、再現可能な判断知へ変換する
  =================================================== -->

  <!-- Thin separator line above thesis label -->
  <line x1="280" y1="320" x2="520" y2="320"
        stroke="#1d1d1f" stroke-width="0.5" stroke-opacity="0.12"
        stroke-linecap="round"/>

  <text x="400" y="348"
        font-family="Hiragino Sans, SF Pro Display, system-ui, sans-serif"
        font-size="11" letter-spacing="0.10em"
        fill="#1d1d1f" fill-opacity="0.40" text-anchor="middle">
    身体知を、再現可能な判断知へ。
  </text>


  <!-- ===================================================
       BACKGROUND TEXTURE — subtle structural grid (Type C, opacity strict)
       64px pitch, hairline, opacity 0.042
  =================================================== -->
  <g stroke="#1d1d1f" stroke-width="0.5" stroke-opacity="0.042">
    <!-- Vertical lines -->
    <line x1="64"  y1="0"   x2="64"  y2="400"/>
    <line x1="128" y1="0"   x2="128" y2="400"/>
    <line x1="192" y1="0"   x2="192" y2="400"/>
    <line x1="256" y1="0"   x2="256" y2="400"/>
    <line x1="320" y1="0"   x2="320" y2="400"/>
    <line x1="384" y1="0"   x2="384" y2="400"/>
    <line x1="448" y1="0"   x2="448" y2="400"/>
    <line x1="512" y1="0"   x2="512" y2="400"/>
    <line x1="576" y1="0"   x2="576" y2="400"/>
    <line x1="640" y1="0"   x2="640" y2="400"/>
    <line x1="704" y1="0"   x2="704" y2="400"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="64"  x2="800" y2="64"/>
    <line x1="0" y1="128" x2="800" y2="128"/>
    <line x1="0" y1="192" x2="800" y2="192"/>
    <line x1="0" y1="256" x2="800" y2="256"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="384" x2="800" y2="384"/>
  </g>

</svg>
