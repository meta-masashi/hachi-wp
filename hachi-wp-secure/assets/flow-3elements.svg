<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 240"
  role="img"
  aria-labelledby="f3-title"
  style="display:block;width:100%;max-width:720px;"
>
  <title id="f3-title">HACHIの思想 — 3要素フロー：観察・構造化・判断</title>

  <!--
    flow-3elements.svg
    Design: Luka CDO / 2026-06-17
    viewBox: 720×240
    Cliché avoided: human silhouettes per element / icon illustrations / card borders / color fills
    Style: Swiss restraint — abstract circle-label-caption vertical stack, hairline arrows
    3 elements: 観察 → 構造化 → 判断
    Element positions: x=154, x=360, x=566
    Circle r=24, center y=68
    Label y=124 (24px Noto Serif JP)
    Caption y=152 (11px Noto Sans JP)
    #2D4295 accent: 1 point — inside 「判断」circle only
    No human figures / no silhouettes
  -->

  <!-- Background: white -->
  <rect width="720" height="240" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════
       ELEMENT 1 — 観察
       cx=154, cy=68
  ════════════════════════════════════════════════ -->

  <circle cx="154" cy="68" r="24"
          fill="none"
          stroke="#1d1d1f" stroke-width="0.8"
          stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner structural dot — faint, not accent -->
  <circle cx="154" cy="68" r="3.5"
          fill="#1d1d1f" fill-opacity="0.55"/>

  <!-- Large label -->
  <text x="154" y="124"
        font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif"
        font-size="24" font-weight="600"
        fill="#1d1d1f"
        text-anchor="middle" letter-spacing="0.06em">観察</text>

  <!-- Caption line 1 -->
  <text x="154" y="155"
        font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif"
        font-size="11" font-weight="400"
        fill="#3a3a3c"
        text-anchor="middle" letter-spacing="0.03em">現場のサインを取り出す</text>

  <!-- ═══════════════════════════════════════════════
       ARROW 1 → 2
  ════════════════════════════════════════════════ -->

  <line x1="218" y1="68" x2="294" y2="68"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.42"
        stroke-linecap="round"/>
  <path d="M 289 63 L 298 68 L 289 73"
        fill="none"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.42"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════════════════════════════════════════
       ELEMENT 2 — 構造化
       cx=360, cy=68
  ════════════════════════════════════════════════ -->

  <circle cx="360" cy="68" r="24"
          fill="none"
          stroke="#1d1d1f" stroke-width="0.8"
          stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner structural dot -->
  <circle cx="360" cy="68" r="3.5"
          fill="#1d1d1f" fill-opacity="0.55"/>

  <text x="360" y="124"
        font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif"
        font-size="24" font-weight="600"
        fill="#1d1d1f"
        text-anchor="middle" letter-spacing="0.06em">構造化</text>

  <text x="360" y="155"
        font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif"
        font-size="11" font-weight="400"
        fill="#3a3a3c"
        text-anchor="middle" letter-spacing="0.03em">傾向と背景を整理する</text>

  <!-- ═══════════════════════════════════════════════
       ARROW 2 → 3
  ════════════════════════════════════════════════ -->

  <line x1="424" y1="68" x2="500" y2="68"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.52"
        stroke-linecap="round"/>
  <path d="M 495 63 L 504 68 L 495 73"
        fill="none"
        stroke="#1d1d1f" stroke-width="1.0" stroke-opacity="0.52"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════════════════════════════════════════
       ELEMENT 3 — 判断 (focal / #2D4295 accent)
       cx=566, cy=68
  ════════════════════════════════════════════════ -->

  <!-- Outer circle — slightly heavier weight to mark convergence -->
  <circle cx="566" cy="68" r="24"
          fill="none"
          stroke="#1d1d1f" stroke-width="1.1"
          stroke-linecap="round" stroke-linejoin="round"/>

  <!-- #2D4295 accent dot — single focal point, 1 per figure rule -->
  <circle cx="566" cy="68" r="3"
          fill="#2D4295"/>

  <text x="566" y="124"
        font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif"
        font-size="24" font-weight="600"
        fill="#1d1d1f"
        text-anchor="middle" letter-spacing="0.06em">判断</text>

  <text x="566" y="155"
        font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif"
        font-size="11" font-weight="400"
        fill="#3a3a3c"
        text-anchor="middle" letter-spacing="0.03em">次の打ち手を組織として再現する</text>

  <!-- ─── HAIRLINE BASELINE at circle center ─── -->
  <line x1="48" y1="68" x2="672" y2="68"
        stroke="#1d1d1f" stroke-width="0.5" stroke-opacity="0.06"
        stroke-linecap="round"/>

</svg>
